<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COS-DROP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07080d;--card:#10121b;--card2:#171a25;--text:#f7f8ff;--muted:#8e93a7;--a:#8b5cf6;--b:#22d3ee;--line:#252938;--good:#4ade80;--danger:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:16px 14px 94px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:25px;font-weight:950;letter-spacing:.5px}.brand span{color:#a78bfa}.pill{background:#151827;border:1px solid var(--line);padding:9px 12px;border-radius:15px;font-weight:850}.hero{background:linear-gradient(135deg,#17152a,#10131c 55%,#0c2630);border:1px solid #303447;border-radius:26px;padding:21px;margin-bottom:14px;box-shadow:0 15px 45px #0007}.hero h1{margin:0 0 7px;font-size:29px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(145deg,#11141e,#0d0f16);border:1px solid var(--line);border-radius:20px;padding:15px;min-height:112px;box-shadow:0 8px 25px #0004;transition:transform .15s,border-color .15s}.card:active{transform:scale(.98)}.card,.hero,.panel,.row{animation:rise .32s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:-80% -30%;background:linear-gradient(115deg,transparent 42%,#ffffff08 50%,transparent 58%);transform:translateX(-35%);animation:shine 7s ease-in-out infinite;pointer-events:none}@keyframes shine{0%,65%,100%{transform:translateX(-35%)}35%{transform:translateX(35%)}}button{transition:transform .12s,filter .12s}button:hover{filter:brightness(1.12)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}.card.click{cursor:pointer}.icon{font-size:29px}.title{font-weight:900;margin-top:7px}.value{font-size:23px;font-weight:950;margin-top:4px}.section{margin-top:16px}.section h2{margin:0 0 11px;font-size:20px}.panel{background:#0f1119;border:1px solid var(--line);border-radius:23px;padding:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #303446;background:#171a25;padding:11px 14px;border-radius:14px;font-weight:850}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,#7c3aed,#0891b2);border:0}.danger{border-color:#512632;color:#fecdd3}.success{border-color:#204d39;color:#bbf7d0}.wide{grid-column:1/-1}.list{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#151823;border:1px solid var(--line);border-radius:16px;padding:12px}.row .left{min-width:0}.row .right{display:flex;gap:7px;align-items:center;flex-shrink:0}.input{width:100%;background:#171a25;border:1px solid #303447;color:#fff;border-radius:14px;padding:12px;outline:none;margin:7px 0}.input:focus{border-color:#7c3aed}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0b0d14ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{background:transparent;border:0;padding:6px 2px;color:#9da2b6;font-size:11px;border-radius:12px}.nav button.active,.nav button:active{background:#151827;color:#fff}.nav button b{display:block;font-size:19px;margin-bottom:2px}.toast{position:fixed;z-index:50;top:18px;left:50%;transform:translateX(-50%);max-width:90%;background:#171a25;border:1px solid #363a4d;border-radius:15px;padding:11px 14px;box-shadow:0 10px 30px #0008}.hide{display:none!important}.modal{position:fixed;z-index:40;inset:0;background:#000a;backdrop-filter:blur(8px);padding:18px;display:flex;align-items:flex-end}.modalbox{width:100%;max-width:760px;margin:auto;background:#10121b;border:1px solid #303447;border-radius:25px;padding:18px;max-height:90vh;overflow:auto}.spinner{display:inline-block;width:17px;height:17px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}.empty{padding:22px;text-align:center;border:1px dashed #303447;border-radius:18px;color:var(--muted)}.casecard{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.price{font-weight:950;font-size:19px;margin-top:8px}.rarity{font-size:12px;color:#aeb4c8}.stat{font-size:12px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.hero{padding:26px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast hide"></div>
<div id="modal" class="modal hide"><div id="modalbox" class="modalbox"></div></div>
<nav class="nav"><div class="navin">
<button id="nav-home" onclick="home()"><b>⌂</b>Главная</button>
<button id="nav-cases" onclick="showCases()"><b>📦</b>Кейсы</button>
<button id="nav-casino" onclick="showCasino()"><b>🎰</b>Казино</button>
<button id="nav-collection" onclick="showCollection()"><b>🎒</b>Коллекция</button>
<button id="nav-profile" onclick="showProfile()"><b>👤</b>Профиль</button>
</div></nav>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#07080d');tg.setBackgroundColor('#07080d')}catch(e){}}
const INIT_DATA=tg&&tg.initData?tg.initData:'';
const HEADERS={'X-Telegram-Init-Data':INIT_DATA};
let state={user:{sd:0,level:1,xp:0,inventory:0},cases:[]};
let busy=false;

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.remove('hide');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hide'),2300)}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hide')}
function closeModal(){document.getElementById('modal').classList.add('hide')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function setNav(name){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const e=document.getElementById('nav-'+name);if(e)e.classList.add('active')}
async function api(path,opt={}){
  const options={...opt,headers:{...HEADERS,...(opt.headers||{})}};
  if(opt.body && typeof opt.body!=='string'){options.body=JSON.stringify(opt.body);options.headers['Content-Type']='application/json'}
  const r=await fetch(path,options);let d={};try{d=await r.json()}catch(e){throw new Error('Сервер вернул неверный ответ')}
  if(!r.ok || d.ok===false)throw new Error(d.error||d.message||'Ошибка запроса');return d;
}
function top(){return `<div class="top"><div class="brand">COS<span>-DROP</span></div><div class="pill">💰 ${Number(state.user?.sd||0).toLocaleString('ru-RU')} SD</div></div>`}
function loading(){document.getElementById('app').innerHTML=top()+`<div class="panel" style="text-align:center;padding:35px"><span class="spinner"></span>Загрузка...</div>`}
function errorPage(err){document.getElementById('app').innerHTML=`<div class="hero"><h1>🌌 COS-DROP</h1><p>${esc(err?.message||'Не удалось загрузить Web App')}</p><p class="muted">Открой сайт через кнопку Web App в Telegram-боте.</p><button class="btn primary" onclick="load()">Повторить</button></div>`}
async function load(){try{loading();state=await api('/api/dashboard');home()}catch(e){errorPage(e)}}
function home(){setNav('home');document.getElementById('app').innerHTML=top()+`
<div class="hero"><h1>Добро пожаловать, ${esc(state.user?.first_name||'игрок')}.</h1><div class="muted">COS-DROP прямо внутри Telegram.</div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="showCases()">🎮 Открыть кейсы</button><button class="btn" onclick="showDuels()">⚔️ Дуэли</button></div></div>
<div class="grid">
<div class="card click" onclick="showProfile()"><div class="icon">👤</div><div class="title">Профиль</div><div class="muted">Lv. ${state.user?.level||1} · ${state.user?.xp||0} XP</div></div>
<div class="card click" onclick="showBalance()"><div class="icon">💰</div><div class="title">Баланс</div><div class="value">${Number(state.user?.sd||0).toLocaleString('ru-RU')}</div></div>
<div class="card click" onclick="showCollection()"><div class="icon">🎒</div><div class="title">Коллекция</div><div class="muted">${state.user?.inventory||0} предметов</div></div>
<div class="card click" onclick="showRating()"><div class="icon">🏆</div><div class="title">Рейтинг</div><div class="muted">Лучшие игроки</div></div>
<div class="card click" onclick="showPromo()"><div class="icon">🎟️</div><div class="title">Промокод</div><div class="muted">Получить SD</div></div>
<div class="card click" onclick="showCasino()"><div class="icon">🎰</div><div class="title">Казино</div><div class="muted">Испытай удачу</div></div>
<div class="card click" onclick="showDuels()"><div class="icon">⚔️</div><div class="title">Дуэли</div><div class="muted">Сражения за SD</div></div>
<div class="card click" onclick="showTasks()"><div class="icon">📋</div><div class="title">Задания</div><div class="muted">Активности</div></div>
<div class="card click" onclick="showAbout()"><div class="icon">ℹ️</div><div class="title">О проекте</div><div class="muted">COS-DROP</div></div>
</div>`}
function showCases(){setNav('cases');const cases=Array.isArray(state.cases)?state.cases:[];document.getElementById('app').innerHTML=top()+`<div class="section"><h2>📦 Кейсы</h2><div class="grid">${cases.length?cases.map(c=>`<div class="card casecard"><div><div class="icon">📦</div><div class="title">${esc(c.name||c.title||c.code)}</div><div class="muted">${esc(c.description||'Открой кейс и получи предмет.')}</div><div class="price">${Number(c.price||0)===0?'Бесплатно':Number(c.price).toLocaleString('ru-RU')+' SD'}</div></div><button class="btn primary" onclick="openCase('${esc(c.code)}')">Открыть</button></div>`).join(''):`<div class="empty wide">Кейсы пока не загружены.</div>`}</div></div>`}
async function openCase(code){try{toast('Открываем кейс...');const d=await api('/api/cases/open',{method:'POST',body:{code}});modal(`<h2>🎉 Выпало!</h2><div class="hero" style="margin-top:10px;text-align:center"><div style="font-size:44px">🎁</div><h2>${esc(d.item?.name||'Предмет')}</h2><div class="rarity">${esc(d.item?.rarity||'')}</div></div><button class="btn primary" style="width:100%" onclick="closeModal();load()">Забрать</button>`)}catch(e){toast(e.message)}}
function showBalance(){setNav('home');document.getElementById('app').innerHTML=top()+`<div class="section"><div class="panel"><h2>💰 Баланс</h2><div class="value" style="font-size:34px">${Number(state.user?.sd||0).toLocaleString('ru-RU')} SD</div><p class="muted">Ежедневный бонус можно получать один раз в день.</p><div class="actions"><button class="btn primary" onclick="daily()">🎁 Забрать бонус</button><button class="btn" onclick="showRating()">🏆 Рейтинг</button></div></div></div>`}
async function daily(){try{const d=await api('/api/daily',{method:'POST'});toast(`🎁 +${d.reward||0} SD · серия ${d.streak||0}`);await load()}catch(e){toast(e.message)}}
function showProfile(){setNav('profile');const u=state.user||{};document.getElementById('app').innerHTML=top()+`<div class="hero"><h1>👤 Профиль</h1><p class="muted">${esc(u.username?'@'+u.username:(u.first_name||'Игрок'))}</p><div class="grid"><div class="card"><div class="title">Telegram ID</div><div class="muted">${esc(u.id||'—')}</div></div><div class="card"><div class="title">Уровень</div><div class="value">${u.level||1}</div></div><div class="card"><div class="title">XP</div><div class="value">${u.xp||0}</div></div><div class="card"><div class="title">CosDrop+</div><div class="value">${u.premium?'💎':'—'}</div></div></div></div><div class="actions"><button class="btn" onclick="showCollection()">🎒 Коллекция</button><button class="btn" onclick="showTasks()">📋 Задания</button></div>`}
async function showCollection(){setNav('collection');try{const d=await api('/api/inventory');const items=d.items||[];document.getElementById('app').innerHTML=top()+`<div class="section"><h2>🎒 Коллекция</h2><div class="list">${items.length?items.map(i=>`<div class="row"><div class="left"><b>${esc(i.name)}</b><div class="rarity">${esc(i.rarity||'')} · ${i.count||1} шт.</div></div><div class="right"><button class="btn" onclick="sellItem(${Number(i.id)})">Продать</button></div></div>`).join(''):`<div class="empty">Коллекция пока пуста.</div>`}</div></div>`}catch(e){toast(e.message)}}
async function sellItem(id){try{const d=await api('/api/inventory/sell',{method:'POST',body:{item_id:id,mode:'one'}});toast(`💰 +${d.reward||0} SD`);await showCollection();state=await api('/api/dashboard')}catch(e){toast(e.message)}}
async function showRating(){setNav('home');try{const d=await api('/api/rating');const users=d.users||[];document.getElementById('app').innerHTML=top()+`<div class="section"><h2>🏆 Рейтинг</h2><div class="list">${users.length?users.map((u,i)=>`<div class="row"><div class="left"><b>#${i+1} ${esc(u.username?'@'+u.username:(u.first_name||u.user_id))}</b><div class="muted">Lv. ${u.level||1}</div></div><b>💰 ${Number(u.sd||0).toLocaleString('ru-RU')}</b></div>`).join(''):`<div class="empty">Рейтинг пока пуст.</div>`}</div></div>`}catch(e){toast(e.message)}}
function showPromo(){setNav('home');document.getElementById('app').innerHTML=top()+`<div class="panel"><h2>🎟️ Промокод</h2><p class="muted">Введи действующий промокод.</p><input id="promo" class="input" placeholder="Введите промокод" autocomplete="off"><button class="btn primary" style="width:100%" onclick="promo()">Активировать</button></div>`}
async function promo(){const code=(document.getElementById('promo')?.value||'').trim();if(!code)return toast('Введите промокод');try{const d=await api('/api/promo',{method:'POST',body:{code}});toast(`🎁 +${d.reward||0} SD`);await load()}catch(e){toast(e.message)}}
function showCasino(){setNav('casino');document.getElementById('app').innerHTML=top()+`<div class="section"><div class="panel"><h2>🎰 COS-CASINO</h2><p class="muted">Баланс: ${Number(state.user?.sd||0).toLocaleString('ru-RU')} SD</p><div class="grid"><div class="card click" onclick="casino('slots')"><div class="icon">🎰</div><div class="title">Слоты</div></div><div class="card click" onclick="casino('dice')"><div class="icon">🎲</div><div class="title">Кости</div></div><div class="card click" onclick="casino('coin')"><div class="icon">🪙</div><div class="title">Монетка</div></div><div class="card click" onclick="casino('roulette')"><div class="icon">🎡</div><div class="title">Рулетка</div></div><div class="card click" onclick="casino('mines')"><div class="icon">💣</div><div class="title">Мины</div></div></div></div></div>`}
async function casino(game){let bet=prompt('Ставка SD:','100');if(!bet)return;bet=Number(bet);if(!Number.isFinite(bet)||bet<=0)return toast('Некорректная ставка');let choice='';if(game==='dice')choice=prompt('lt — меньше 7, gt — больше 7, eq — ровно 7','lt')||'';if(game==='coin')choice=prompt('o — орёл, r — решка','o')||'';if(game==='roulette')choice=prompt('red / black / green','red')||'';try{const d=await api('/api/casino',{method:'POST',body:{game,bet,choice,mines:3}});toast(`${d.result||'Готово'} ${d.win?`· 🎉 +${d.win}`:''}`);state=await api('/api/dashboard');showCasino()}catch(e){toast(e.message)}}
async function showDuels(){setNav('home');try{const d=await api('/api/duel',{method:'POST',body:{action:'list'}});const duels=d.duels||[];document.getElementById('app').innerHTML=top()+`<div class="section"><div class="panel"><h2>⚔️ Дуэли</h2><p class="muted">Создай дуэль и дождись соперника.</p><button class="btn primary" onclick="createDuel()">⚔️ Создать дуэль</button></div><div class="list" style="margin-top:10px">${duels.length?duels.map(x=>`<div class="row"><div class="left"><b>${esc(x.username?'@'+x.username:(x.challenger_id||'Игрок'))}</b><div class="muted">Ставка ${Number(x.amount||0).toLocaleString('ru-RU')} SD · #${x.id}</div></div><button class="btn" onclick="acceptDuel(${Number(x.id)})">Принять</button></div>`).join(''):`<div class="empty">Открытых дуэлей нет.</div>`}</div></div>`}catch(e){toast(e.message)}}
async function createDuel(){const amount=Number(prompt('Ставка SD:',String(state.user?.duel_min||100)));if(!amount)return;try{const d=await api('/api/duel',{method:'POST',body:{action:'create',amount}});toast(`⚔️ Дуэль #${d.id} создана`);await showDuels()}catch(e){toast(e.message)}}
async function acceptDuel(id){try{const d=await api('/api/duel',{method:'POST',body:{action:'accept',id}});toast(d.winner==state.user?.id?'🏆 Ты победил!':'⚔️ Дуэль завершена');state=await api('/api/dashboard');await showDuels()}catch(e){toast(e.message)}}
async function showTasks(){setNav('home');try{const d=await api('/api/tasks');const tasks=d.tasks||[];document.getElementById('app').innerHTML=top()+`<div class="section"><h2>📋 Задания</h2><div class="list">${tasks.length?tasks.map(t=>`<div class="row"><div class="left"><b>${esc(t.title||t.name||'Задание')}</b><div class="muted">${esc(t.description||'')}</div></div><div class="right"><span class="stat">+${t.reward||0} SD</span>${t.completed?'<span>✅</span>':'<button class="btn" onclick="claimTask(\''+esc(t.id)+'\')">Получить</button>'}</div></div>`).join(''):`<div class="empty">Заданий пока нет.</div>`}</div></div>`}catch(e){toast(e.message);home()}}
async function claimTask(id){try{const d=await api('/api/tasks/claim',{method:'POST',body:{task_id:id}});toast(`🎁 +${d.reward||0} SD`);await load();showTasks()}catch(e){toast(e.message)}}
function showAbout(){setNav('home');document.getElementById('app').innerHTML=top()+`<div class="hero"><h1>🌌 COS-DROP</h1><p class="muted">Игровой Telegram Web App с кейсами, коллекцией, казино, рейтингом и дуэлями.</p><div class="actions"><button class="btn" onclick="showDuels()">⚔️ Дуэли</button><button class="btn" onclick="showCases()">📦 Кейсы</button></div></div>`}
load();
</script>
</body>
</html>
